# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: corridor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Optional: an Open-Meteo commercial key lifts the free-tier rate limit.
      - key: OPEN_METEO_API_KEY
        sync: false
